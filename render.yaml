services:
  - type: worker
    name: kalshi-relay-shadow
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m relay_engine.shadow_runner
    envVars:
      - key: RUN_MODE
        value: SHADOW
      # P6 §5: the curriculum must survive the classroom — DB on the mounted disk
      - key: RELAY_DB_PATH
        value: /var/data/relay_shadow.db
