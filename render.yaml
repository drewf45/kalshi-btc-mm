services:
  - type: web
    name: kalshi-btc-mm
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
  - type: web
    name: kalshi-shib-mm
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python shib_bot.py
    healthCheckPath: /