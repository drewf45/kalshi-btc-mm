services:
  - type: web
    name: kalshi-btc-mm
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
  - type: web
    name: kalshi-xrp-mm
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python xrp_bot.py
    healthCheckPath: /